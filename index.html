<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=390,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" id="vp"/>
<script>
(function(){
  var vp = document.getElementById('vp') ||
           document.querySelector('meta[name=viewport]');
  var screenW = screen.width;
  // FIXED: Proper 1.0 scale for all devices
  var scale = 1.0;
  vp.setAttribute('content',
    'width=device-width' +
    ',initial-scale=' + scale.toFixed(4) +
    ',minimum-scale=' + scale.toFixed(4) +
    ',maximum-scale=' + scale.toFixed(4) +
    ',user-scalable=no'
  );
  document.documentElement.style.setProperty('--vp-scale', scale.toFixed(4));
})();
</script>
